  <body class="min-h-screen bg-gradient-to-br from-[#FFF6ED] via-[#FDF9F4] to-[#F1EEFA] text-[#1A202C] font-sans antialiased selection:bg-[#C49A43] selection:text-white">
    <div id="root">
      <div id="pre-react-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAF7F2;z-index:99999;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;">
        <!-- Glowing Ambient Rings -->
        <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
          <div style="position:absolute;inset:-10px;border-radius:50%;border:2px dashed rgba(196,154,67,0.4);animation:spin 12s linear infinite;"></div>
          <div style="position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(circle, rgba(196,154,67,0.25) 0%, transparent 70%);animation:pulse 2s ease-in-out infinite;"></div>
          <div style="width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg, #FFF9EE, #FAF0D9, #EBD5A8);border:2.5px solid #C49A43;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(196,154,67,0.25);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9A721C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="3" width="16" height="16" rx="2"></rect>
              <path d="M4 11h16"></path>
              <path d="M12 3v8"></path>
              <path d="m8 19-2 3"></path>
              <path d="m16 19 2 3"></path>
              <circle cx="8" cy="15" r="1" fill="#9A721C"></circle>
              <circle cx="16" cy="15" r="1" fill="#9A721C"></circle>
            </svg>
          </div>
        </div>
        <!-- Brand Title & Tagline -->
        <div style="font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;color:#1A2E3B;letter-spacing:-0.5px;margin:0 0 6px 0;">
          AAROH<span style="color:#C49A43;margin:0 6px;">•</span>SAARTHI
        </div>
        <div style="font-size:11px;color:#7A7269;margin:0 0 22px 0;letter-spacing:0.8px;font-weight:600;text-transform:uppercase;">
          DELHI MULTIMODAL TRANSIT ENGINE
        </div>
        <!-- Transit Progress Bar -->
        <div style="width:200px;height:4px;background:#EDE8E1;border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg, #C49A43, #166534, #C49A43);border-radius:99px;animation:transitSweep 1.4s ease-in-out infinite;"></div>
        </div>
        <div style="font-size:11px;color:#A1988B;margin-top:14px;font-weight:600;letter-spacing:0.3px;">
          Synchronizing Real-Time GTFS Telemetry...
        </div>
      </div>
      <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 0.4; } }
        @keyframes transitSweep { 0% { left: -40%; width: 40%; } 50% { left: 30%; width: 50%; } 100% { left: 100%; width: 40%; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
